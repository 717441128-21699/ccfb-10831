<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}农批价格采集后台{% endblock %}</title>
<style>
:root { --line:#d9dee7; --head:#1f3a5f; --bg:#f5f7fa; --ok:#1a7f4b; --warn:#b7791f;
        --bad:#c0392b; --held:#8e44ad; }
* { box-sizing: border-box; }
body { margin:0; font-family: "Microsoft YaHei", system-ui, sans-serif; background:var(--bg); color:#1d2733; }
header { background:var(--head); color:#fff; padding:14px 26px; display:flex; gap:22px; align-items:center; flex-wrap:wrap; }
header .brand { font-weight:700; font-size:17px; margin-right:10px; }
header a { color:#cdd9ea; text-decoration:none; font-size:14px; }
header a:hover, header a.active { color:#fff; }
main { padding:24px 28px; max-width:1280px; margin:0 auto; }
h1 { font-size:20px; margin:0 0 16px; }
h2 { font-size:16px; margin:22px 0 10px; }
table { border-collapse:collapse; width:100%; background:#fff; font-size:13.5px; }
th,td { border:1px solid var(--line); padding:7px 10px; text-align:left; vertical-align:top; }
th { background:#eef2f8; font-weight:600; }
tr:nth-child(even) td { background:#fafbfd; }
.cards { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:20px; }
.card { background:#fff; border:1px solid var(--line); border-radius:8px; padding:16px 22px; min-width:150px; }
.card .num { font-size:26px; font-weight:700; }
.card .lbl { color:#667; font-size:13px; margin-top:4px; }
.badge { display:inline-block; padding:2px 9px; border-radius:11px; font-size:12px; white-space:nowrap; }
.badge.verified { background:#e3f5ec; color:var(--ok); }
.badge.held { background:#f3e8fb; color:var(--held); }
.badge.closed { background:#eceff3; color:#667; }
.badge.done { background:#e3f5ec; color:var(--ok); }
.badge.missing { background:#fdecea; color:var(--bad); }
.badge.pending { background:#fdf6e3; color:var(--warn); }
.badge.failed { background:#fdecea; color:var(--bad); }
.badge.approved { background:#e3f5ec; color:var(--ok); }
.badge.rejected { background:#eceff3; color:#778; }
.filters { background:#fff; border:1px solid var(--line); border-radius:8px; padding:12px 16px; margin-bottom:16px; display:flex; gap:12px; flex-wrap:wrap; align-items:end; }
.filters label { font-size:12.5px; color:#556; display:flex; flex-direction:column; gap:4px; }
input,select,button { font-size:13.5px; padding:6px 10px; border:1px solid var(--line); border-radius:6px; }
button { background:var(--head); color:#fff; cursor:pointer; border:none; }
button.warn { background:var(--ok); }
button.gray { background:#6c7a89; }
.cal-grid td { width:13.6%; height:92px; vertical-align:top; font-size:12.5px; padding:6px; }
.cal-grid .dow { background:var(--head); color:#fff; text-align:center; }
.cal-grid .closed-cell { background:#f0f2f5; color:#889; }
.cal-grid .missing-cell { background:#fdecea; }
.cal-grid .done-cell { background:#f4fbf7; }
.snap-img { max-width:230px; border:1px solid var(--line); border-radius:4px; }
a { color:#235597; }
.small { font-size:12px; color:#667; }
form.inline { display:inline; }
</style>
</head>
<body>
<header>
  <span class="brand">农批价格指数采集平台</span>
  <a href="/">总览</a>
  <a href="/markets">市场管理</a>
  <a href="/calendar?market_id=m1">采集日历</a>
  <a href="/snapshots?market_id=m1">原始快照</a>
  <a href="/prices?market_id=m1">价格库</a>
  <a href="/anomalies?status=held">异常价格</a>
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
